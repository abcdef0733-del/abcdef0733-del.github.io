<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دلوقتي ماركت</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0F1B4C"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBFAF6;--card:#fff;--ink:#1F2A24;--mute:#66736b;--green:#E8520A;--sun:#FFD3B8;--tom:#c0392b;--line:#e7e4da;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a17;--card:#1d2621;--ink:#f1f0ea;--mute:#9aa8a0;--line:#2c3832}}
:root[data-theme="dark"]{--bg:#141a17;--card:#1d2621;--ink:#f1f0ea;--mute:#9aa8a0;--line:#2c3832}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif;padding-bottom:90px}
button,input,select{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#0F1B4C;color:#fff;border-bottom:4px solid #FF5F0F}
header h1{margin:0;font-size:22px;font-weight:800;flex:1}
.hb{display:flex;gap:8px}
.ic{width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:18px;display:grid;place-items:center;text-decoration:none;cursor:pointer}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;position:sticky;top:0;background:var(--bg);z-index:5}
.tab{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:600}
.tab[aria-pressed=true]{background:var(--sun);border-color:var(--sun);color:#1F2A24}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:4px 16px 16px;max-width:900px;margin:auto}
.p{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px}
.em{font-size:52px;text-align:center;line-height:1.2;background:color-mix(in srgb,var(--sun) 22%,var(--card));border-radius:10px;padding:8px}
.p b{font-size:15px}.p small{color:var(--mute)}
.pr{font-weight:800;color:var(--green);font-size:17px}
.add{margin-top:auto;border:0;border-radius:10px;background:var(--green);color:#fff;padding:8px;font-weight:600;cursor:pointer}
.qty{display:flex;align-items:center;justify-content:space-between;margin-top:auto;background:var(--bg);border-radius:10px;padding:2px}
.qty button{width:34px;height:34px;border:0;border-radius:8px;background:var(--green);color:#fff;font-size:18px;cursor:pointer}
.bar{position:fixed;inset-inline:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border:0;border-radius:14px;padding:14px 18px;display:flex;justify-content:space-between;font-weight:800;cursor:pointer;z-index:8;max-width:600px;margin:auto}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:none}
.sheet.on{display:flex;align-items:flex-end;justify-content:center}
.pan{background:var(--bg);width:100%;max-width:600px;max-height:88%;overflow:auto;border-radius:20px 20px 0 0;padding:18px;display:flex;flex-direction:column;gap:10px}
.pan h2{margin:0}
.row{display:flex;align-items:center;gap:8px;justify-content:space-between;border-bottom:1px solid var(--line);padding:6px 0}
.row .qty{margin:0;min-width:110px}
input,select{width:100%;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--card)}
.wa{border:0;border-radius:12px;background:#25D366;color:#0b2a17;padding:14px;font-weight:800;font-size:16px;cursor:pointer}
.note{background:color-mix(in srgb,var(--sun) 30%,var(--bg));border-radius:10px;padding:8px 12px;font-size:14px}
.sec{border:1.5px dashed var(--line);border-radius:12px;padding:10px;display:grid;gap:8px}
.mini{width:80px}.del{border:0;background:none;color:var(--tom);font-size:18px;cursor:pointer}
.sv{border:0;border-radius:12px;background:var(--green);color:#fff;padding:12px;font-weight:800;cursor:pointer}
.empty{text-align:center;color:var(--mute);padding:30px 0}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
label{display:grid;gap:2px;font-size:12px;color:var(--mute);flex:1}
</style>
</head>

const trk=p=>p&&p.stock!==undefined&&p.stock!==''&&p.stock!==null;
const newN=()=>orders.filter(o=>o.status==='new').length;
const ST={new:'جديد',prep:'قيد التجهيز',ready:'جاهز',done:'تم التسليم',cancel:'ملغي'};
function beep(f){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.frequency.value=f||880;o.connect(a.destination);o.start();setTimeout(()=>{o.stop();a.close()},150)}catch(e){}}
function pic(p){return p.img?'<img src="'+esc(p.img)+'" alt="" style="width:100%;height:80px;object-fit:cover;border-radius:8px">':esc(p.emoji)}
function card(p){
 const q=cart[p.id]||0;
 return `<div class="p"><div class="em">${pic(p)}</div><b>${esc(p.name)}</b><small>${esc(p.unit)}</small><span class="pr">${p.price} ج.م</span>`+
 (q?`<div class="qty"><button data-inc="${p.id}" aria-label="زيادة">+</button><b>${q}</b><button data-dec="${p.id}" aria-label="نقصان">−</button></div>`:(trk(p)&&p.stock<=0?`<button class="add" disabled style="opacity:.5">نفدت الكمية</button>`:`<button class="add" data-inc="${p.id}">أضف للسلة</button>`))+`</div>`}
function render(){
 const list=S.prods.filter(p=>p.cat===cat);
 $('#app').innerHTML=`<header>${logo()}<h1>${esc(S.store.name)}</h1><div class="hb"><a class="ic" href="tel:${esc(S.store.phone)}" aria-label="اتصل بالمحل">📞</a><a class="ic" href="${esc(S.store.map)}" target="_blank" rel="noopener" aria-label="موقع المحل">📍</a>${owner?`<button class="ic" data-admin aria-label="لوحة التحكم">${admin?'✕':'⚙️'}${!admin&&newN()?'<b style="font-size:12px;background:#E8520A;border-radius:9px;padding:0 5px">'+newN()+'</b>':''}</button>`:''}</div></header>`+
 (admin&&tab==='orders'?'':`<nav class="tabs">${S.cats.map(c=>`<button class="tab" data-cat="${c.id}" aria-pressed="${c.id===cat}">${esc(c.icon)} ${esc(c.name)}</button>`).join('')}</nav>`)+
 (admin?adminBar()+(tab==='orders'?ordersView():adminPanel()):'')+
 (admin?'':`<main class="grid">${list.map(card).join('')||'<p class="empty">لا توجد منتجات في هذا القسم</p>'}</main>`)+
 (!admin&&count()?`<button class="bar" data-cart><span>السلة (${count()})</span><span>${total()} ج.م</span></button>`:'')+
 `<div class="sheet ${open?'on':''}" data-close><div class="pan">${open==='cart'?cartView():open==='login'?loginView():String(open).startsWith('prep')?prepSheet():''}</div></div>`;
}
function adminBar(){return `<div class="tabs" style="position:static"><button class="tab" data-tab="orders" aria-pressed="${tab==='orders'}">📦 الطلبات ${newN()?'('+newN()+')':''}</button><button class="tab" data-tab="products" aria-pressed="${tab==='products'}">🗂 المنتجات والمخزون</button></div>`}
function orderCard(o){
 const num=o.id.slice(0,5).toUpperCase(),t=new Date(o.ts).toLocaleString('ar-EG');
 const items=o.items.map(i=>`• ${esc(i.name)} × ${i.qty}`).join('<br>');
 const b=(st,l,c)=>`<button class="${c||'sv'}" data-st="${st}" data-id="${o.id}">${l}</button>`;
 const x={new:b('prep','بدء التجهيز')+b('cancel','إلغاء','del'),prep:`<button class="sv" data-prep="${o.id}">📷 تجهيز بالباركود</button>`+b('ready','جاهز')+b('cancel','إلغاء','del'),ready:b('done','تم التسليم')+b('cancel','إلغاء','del')}[o.status]||'';
 return `<div class="sec"><b>#${num} — ${ST[o.status]||o.status}</b><small>${t}</small><div>${esc(o.name)} · <a href="tel:${esc(o.phone)}">${esc(o.phone)}</a><br>${esc(o.addr)}</div><div>${items}</div><b>${o.total} ج.م — دفع عند الاستلام</b><div style="display:flex;gap:6px;flex-wrap:wrap">${x}</div></div>`}
function ordersView(){
 const act=orders.filter(o=>['new','prep','ready'].includes(o.status)),old=orders.filter(o=>!act.includes(o));
 return `<div class="grid" style="display:block">${act.map(orderCard).join('')||'<p class="empty">لا توجد طلبات نشطة</p>'}${old.length?'<h3>السابقة</h3>'+old.slice(0,20).map(orderCard).join(''):''}</div>`}
const po=()=>orders.find(o=>o.id===String(open).slice(5));
function prepView(o){
 const s=ps[o.id]||(ps[o.id]={});
 const rows=o.items.map(i=>{const c=s[i.id]||0;return `<div class="row"><span>${c>=i.qty?'✅':'⬜'} ${esc(i.name)}<br><small>${i.barcode?'باركود: '+esc(i.barcode):'بدون باركود'}</small></span><div class="qty"><b>${c}/${i.qty}</b><button data-man="${i.id}">+</button></div></div>`}).join('');
 const all=o.items.every(i=>(s[i.id]||0)>=i.qty);
 return rows+(all?`<button class="wa" data-st="ready" data-id="${o.id}">تم التجهيز — الطلب جاهز ✓</button>`:'')}
function prepSheet(){
 const o=po();if(!o)return '';
 return `<h2>تجهيز #${o.id.slice(0,5).toUpperCase()}</h2><div class="note">${esc(o.name)} — ${esc(o.addr)}</div><video id="cv" playsinline muted style="display:none;width:100%;border-radius:12px"></video><input id="sc" placeholder="امسح الباركود أو اكتبه ثم Enter" inputmode="numeric"><button class="sv" data-cam>📷 مسح بالكاميرا</button><div id="msg" class="note">جاهز للمسح</div><div id="pb">${prepView(o)}</div>`}
function scan(c){
 const o=po();if(!o)return;
 const s=ps[o.id]||(ps[o.id]={}),code=String(c).trim(),m=$('#msg');
 const hit=o.items.filter(i=>i.barcode&&i.barcode===code),it=hit.find(i=>(s[i.id]||0)<i.qty);
 if(it){s[it.id]=(s[it.id]||0)+1;beep(900);m.textContent='✔ '+it.name}
 else{beep(300);m.textContent=hit.length?'⚠ الكمية مكتملة: '+hit[0].name:'❌ الصنف غير موجود في الطلب'}
 $('#pb').innerHTML=prepView(o)}
function man(id){
 const o=po(),s=ps[o.id]||(ps[o.id]={}),i=o.items.find(x=>x.id===id);
 if(i&&(s[id]||0)<i.qty)s[id]=(s[id]||0)+1;
 $('#pb').innerHTML=prepView(o)}
async function cam(){
 if(!('BarcodeDetector' in window)){alert('المتصفح لا يدعم مسح الباركود بالكاميرا. استخدم قارئ باركود أو اكتب الرقم');return}
 try{
  const v=$('#cv'),st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
  v.srcObject=st;v.style.display='block';await v.play();
  const d=new BarcodeDetector();let last=0;
  const t=setInterval(async()=>{
   if(!document.body.contains(v)){clearInterval(t);st.getTracks().forEach(x=>x.stop());return}
   try{const r=await d.detect(v);if(r[0]&&Date.now()-last>1500){last=Date.now();scan(r[0].rawValue)}}catch(e){}
  },400);
 }catch(e){alert('تعذر تشغيل الكاميرا')}}
async function setSt(id,st){
 const o=orders.find(x=>x.id===id);if(!o)return;
 const upd={status:st},dec=st==='prep'&&!o.deducted,inc=st==='cancel'&&o.deducted;
 try{
  if(dec||inc){
   o.items.forEach(i=>{const p=prod(i.id);if(trk(p))p.stock=(+p.stock)+(dec?-i.qty:i.qty)});
   upd.deducted=dec;
   await ref.set({store:S.store,cats:S.cats,prods:S.prods});
  }
  await db.collection('orders').doc(id).update(upd);
 }catch(e){alert('تعذر التحديث: '+(e&&e.code||'خطأ'))}}
function applyJard(){
 const r=[];
 document.querySelectorAll('[data-count]').forEach(i=>{
  if(i.value==='')return;
  const p=prod(i.dataset.count),n=+i.value,old=trk(p)?+p.stock:0;
  if(n!==old)r.push(p.name+': '+old+' ← '+n);
  p.stock=n;
 });
 alert(r.length?'فروقات الجرد:\n'+r.join('\n'):'لا توجد فروقات');
 jard=false}
function prodRow(p){
 const f=(k,l,t)=>`<label>${l}<input ${t?'type="number" inputmode="decimal"':''} data-f="${k}" data-id="${p.id}" value="${esc(p[k]===undefined?'':p[k])}"></label>`;
 const low=trk(p)&&p.stock<=5;
 return `<div class="sec"><div style="display:flex;gap:6px;align-items:end">${f('name','الاسم')}<button class="del" data-del="${p.id}" aria-label="حذف">🗑</button></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">${f('price','السعر',1)}${f('stock','المخزون'+(low?' ⚠️':''),1)}${f('barcode','الباركود')}${f('unit','الوحدة')}${f('emoji','رمز')}${f('img','رابط صورة')}</div>${jard?`<label>الكمية الفعلية (النظام: ${trk(p)?p.stock:'—'})<input type="number" data-count="${p.id}"></label>`:''}</div>`}
function loginView(){return '<h2>دخول صاحب المحل</h2><input id="le" type="email" placeholder="البريد الإلكتروني"><input id="lp" type="password" placeholder="كلمة المرور"><button class="sv" data-login>دخول</button>'}
function adminPanel(){
 const list=S.prods.filter(p=>p.cat===cat);
 return `<div class="grid" style="display:block;padding-bottom:0"><div style="display:flex;gap:8px;margin-bottom:10px"><button class="sv" style="flex:1" data-jard>${jard?'إلغاء الجرد':'📋 جرد المخزون'}</button>${jard?'<button class="wa" style="flex:1" data-applyjard>اعتماد الجرد</button>':''}</div>
 ${list.map(prodRow).join('')||'<p class="empty">لا توجد منتجات في هذا القسم</p>'}
 <div class="sec" style="margin-top:10px"><b>إضافة منتج إلى القسم الحالي</b><input id="pn" placeholder="اسم المنتج"><input id="pp" type="number" placeholder="السعر"><input id="pu" placeholder="الوحدة (كيلو، علبة...)"><input id="pe" placeholder="رمز (إيموجي) مثل 🍎"><input id="pi" placeholder="رابط صورة المنتج (اختياري)"><input id="pk" placeholder="الباركود (اختياري)"><input id="pst" type="number" placeholder="كمية المخزون (فارغ = بدون متابعة)"><button class="sv" data-addprod>إضافة المنتج</button></div>
 <div class="sec" style="margin-top:10px"><b>إضافة قسم</b><input id="nc" placeholder="اسم القسم"><input id="ni" placeholder="رمز (إيموجي) مثل 🍎"><button class="sv" data-addcat>إضافة القسم</button></div>
 <div class="sec" style="margin-top:10px"><b>بيانات المحل</b><input id="sn" value="${esc(S.store.name)}" placeholder="اسم المحل"><input id="sw" value="${esc(S.store.wa)}" placeholder="رقم واتساب بالصيغة الدولية 20100..."><input id="sp" value="${esc(S.store.phone)}" placeholder="رقم الهاتف"><input id="sm" value="${esc(S.store.map)}" placeholder="رابط الموقع على الخريطة"></div>
 <button class="sv" style="width:100%;margin:10px 0" data-save>حفظ ونشر التعديلات</button>
 ${cat?`<button class="del" data-delcat="${cat}">حذف القسم الحالي 🗑</button>`:''}<button class="del" data-logout>تسجيل الخروج</button></div>`}
function cartView(){
 const rows=Object.entries(cart).filter(([i])=>prod(i)).map(([i,q])=>{const p=prod(i);return `<div class="row"><span>${esc(p.emoji)} ${esc(p.name)}<br><small>${p.price*q} ج.م</small></span><div class="qty"><button data-inc="${i}">+</button><b>${q}</b><button data-dec="${i}">−</button></div></div>`}).join('');
 if(!rows)return '<h2>السلة</h2><p class="empty">السلة فاضية</p>';
 return `<h2>سلة المشتريات</h2>${rows}<div class="row"><b>الإجمالي</b><b>${total()} ج.م</b></div><div class="note">💵 الدفع عند الاستلام</div><input id="cn" placeholder="الاسم"><input id="ca" placeholder="العنوان بالتفصيل"><input id="cp" type="tel" placeholder="رقم موبايلك"><button class="wa" data-send>إرسال الطلب عبر واتساب</button>`}
async function send(){
 const n=$('#cn').value.trim(),a=$('#ca').value.trim(),ph=$('#cp').value.trim();
 if(!n||!a||!ph){alert('اكتب الاسم والعنوان ورقم الموبايل');return}
 const w=window.open('about:blank','_blank');
 const items=Object.entries(cart).filter(([i])=>prod(i)).map(([i,q])=>({id:i,name:prod(i).name,price:prod(i).price,qty:q,barcode:String(prod(i).barcode||'').trim()}));
 let num='';
 try{const d=await db.collection('orders').add({items,total:total(),name:n,addr:a,phone:ph,status:'new',ts:Date.now()});num=d.id.slice(0,5).toUpperCase()}catch(e){}
 const lines=items.map(i=>`• ${i.name} × ${i.qty} = ${i.price*i.qty} ج.م`);
 const msg=`طلب جديد${num?' #'+num:''} من ${S.store.name}\n${lines.join('\n')}\nالإجمالي: ${total()} ج.م\nالدفع: عند الاستلام\nالاسم: ${n}\nالعنوان: ${a}\nالموبايل: ${ph}`;
 const url='https://wa.me/'+S.store.wa.replace(/\D/g,'')+'?text='+encodeURIComponent(msg);
 if(w)w.location.href=url;else location.href=url;
 Object.keys(cart).forEach(k=>delete cart[k]);open=null;render();
}
async function save(){
 S.store={name:$('#sn').value||S.store.name,wa:$('#sw').value,phone:$('#sp').value,map:$('#sm').value};
 try{await ref.set({store:S.store,cats:S.cats,prods:S.prods});alert('تم الحفظ والنشر');}
 catch(e){alert('تعذر الحفظ: '+(e&&e.code||'خطأ'))}
}
function login(){auth.signInWithEmailAndPassword($('#le').value.trim(),$('#lp').value).then(()=>{open=null;admin=true;render()}).catch(()=>alert('البريد أو كلمة المرور غير صحيحة'))}
document.addEventListener('click',e=>{
 const t=e.target,g=k=>t.closest('['+k+']');
 let x;
 if(t.classList.contains('sheet')){open=null}
 else if((x=g('data-cat')))cat=x.dataset.cat;
 else if((x=g('data-inc'))){const i=x.dataset.inc,p=prod(i),c=cart[i]||0;if(trk(p)&&c>=p.stock)alert('الكمية المتاحة '+p.stock);else cart[i]=c+1}
 else if((x=g('data-dec'))){const i=x.dataset.dec;cart[i]=(cart[i]||0)-1;if(cart[i]<=0)delete cart[i];if(!count())open=null}
 else if(g('data-cart'))open='cart';
 else if(g('data-send')){send();return}
 else if(g('data-admin'))admin=!admin;
 else if((x=g('data-del')))S.prods=S.prods.filter(p=>p.id!==x.dataset.del);
 else if((x=g('data-delcat'))){if(!confirm('حذف القسم وكل منتجاته؟'))return;const c=x.dataset.delcat;S.cats=S.cats.filter(k=>k.id!==c);S.prods=S.prods.filter(p=>p.cat!==c);cat=S.cats[0]&&S.cats[0].id}
 else if(g('data-addcat')){const n=$('#nc').value.trim();if(!n)return;const id=uid();S.cats.push({id,name:n,icon:$('#ni').value||'🛒'});cat=id}
 else if(g('data-addprod')){const n=$('#pn').value.trim(),p=parseFloat($('#pp').value);if(!n||isNaN(p)||!cat){alert('اكتب اسم المنتج والسعر واختر قسم');return}S.prods.push({id:uid(),cat,name:n,price:p,unit:$('#pu').value||'قطعة',emoji:$('#pe').value||'🛒',img:$('#pi').value.trim(),barcode:$('#pk').value.trim(),stock:$('#pst').value===''?'':+$('#pst').value})}
 else if(g('data-save')){save();return}
 else if((x=g('data-tab')))tab=x.dataset.tab
 else if((x=g('data-st'))){setSt(x.dataset.id,x.dataset.st).then(()=>{open=null;render()});return}
 else if((x=g('data-prep')))open='prep:'+x.dataset.prep
 else if(g('data-cam')){cam();return}
 else if((x=g('data-man'))){man(x.dataset.man);return}
 else if(g('data-jard'))jard=!jard
 else if(g('data-applyjard')){applyJard();render();save();return}
 else if(g('data-login')){login();return}
 else if(g('data-logout')){auth.signOut();admin=false}
 else return;
 render();
});
document.addEventListener('change',e=>{const t=e.target,f=t.dataset.f;if(!f)return;const p=prod(t.dataset.id);if(!p)return;p[f]=(f==='price'||f==='stock')?(t.value===''&&f==='stock'?'':parseFloat(t.value)||0):t.value});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='sc'){scan(e.target.value);e.target.value=''}});
render();
firebase.initializeApp(FIREBASE_CONFIG);
const auth=firebase.auth(),db=firebase.firestore(),ref=db.collection('store').doc('main');
function apply(d){if(d.store)S.store=d.store;if(d.cats)S.cats=d.cats;if(d.prods)S.prods=d.prods;if(!S.cats.find(c=>c.id===cat))cat=S.cats[0]&&S.cats[0].id}
try{const c=localStorage.getItem('dm');if(c){apply(JSON.parse(c));render()}}catch(e){}
ref.onSnapshot(d=>{if(d.exists&&!admin){apply(d.data());try{localStorage.setItem('dm',JSON.stringify(d.data()))}catch(e){}render()}});
auth.onAuthStateChanged(u=>{
 owner=!!u;
 if(!u){admin=false;if(unsub){unsub();unsub=null}}
 else if(!unsub)unsub=db.collection('orders').orderBy('ts','desc').limit(60).onSnapshot(sn=>{
  orders=sn.docs.map(d=>({id:d.id,...d.data()}));
  const n=newN();if(prevNew>=0&&n>prevNew)beep();prevNew=n;
  if(!admin||(tab==='orders'&&!String(open).startsWith('prep')))render();
 },e=>{});
 render()});
if(location.hash==='#admin'){open='login';render()}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
